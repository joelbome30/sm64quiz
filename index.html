<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Quiz de Super Mario 64 inspirado en el menú File Select.">
  <title>SM64 Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <img id="mario-hand" class="mario-hand" src="mario-hand.png" alt="" aria-hidden="true">

  <main class="screen">
    <header class="hero">
      <h1 id="logo" class="logo" aria-label="Select Answer"></h1>
    </header>

    <section class="hud" aria-label="Estado del quiz">
      <span id="question-counter">Pregunta 1 de 12</span>
      <span id="score-counter" aria-live="polite">Puntaje: 0</span>
      <div class="progress"><div id="progress-bar"></div></div>
    </section>

    <section class="quiz" aria-labelledby="question-title">
      <div id="quiz-content">
        <h2 id="question-title" tabindex="-1"></h2>
        <div id="question-image-container" class="question-image" hidden>
          <img id="question-image" src="" alt="">
        </div>
        <div id="answers" class="answers" role="radiogroup" aria-labelledby="question-title"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <div class="actions">
          <button id="check-button" class="menu-button score" type="button" disabled><span>CHECK</span></button>
          <button id="next-button" class="menu-button copy" type="button" hidden><span id="next-label">NEXT</span></button>
        </div>
      </div>

      <div id="result" class="result" hidden aria-live="polite">
        <div id="result-icon" class="result-icon">★</div>
        <h2 id="result-title">QUIZ COMPLETE</h2>
        <p id="result-score"></p>
        <p id="result-message"></p>
        <button id="restart-button" class="menu-button erase" type="button"><span>RETRY</span></button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
